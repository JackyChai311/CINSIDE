name: Build macOS & Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列)
          - os: macos-14
            arch: arm64
          # Intel（macos-13 已于 2025-12-04 退役，任务会排队 24h 后被杀；
          # macos-15-intel 是官方免费替代标签，支持至 2027-08）
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    # macos-15-intel 上 DMG 构建后 hdiutil detach 偶发 "Resource busy"（产物已上传、
    # 只是收尾清理失败导致退出码 1）——不让它把整个工作流标红、也不阻塞 Release 发布
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # DMG 构建后 hdiutil detach 被 Spotlight 索引占用 → Resource busy →
      # electron-builder "Cannot cleanup" 退出非零（macos-15-intel 必现），先关索引
      - name: Disable Spotlight indexing (fix hdiutil detach busy)
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -f mds_stores || true

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller cinside-backend.spec --clean --noconfirm

      - name: Build Electron app and publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --${{ matrix.arch }} --publish always

      - name: Build Electron app (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinside-macos-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
          if-no-files-found: warn

  # Windows x64：NSIS 安装包（主更新渠道：Setup + blockmap + latest.yml 驱动 electron-updater 自动更新）
  build-win:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build backend (PyInstaller)
        working-directory: backend
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
          .\.venv\Scripts\pyinstaller.exe cinside-backend.spec --clean --noconfirm

      - name: Build Electron app and publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Build Electron app (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinside-windows-x64
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/*.exe.blockmap
          if-no-files-found: warn
