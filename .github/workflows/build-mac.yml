name: Build macOS & Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============ 质量门禁：lint / 类型 / 测试 ============
  # 在打包之前跑完，失败则两个 build job 都不会启动。
  quality-web:
    name: Quality · 前端
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (tsc)
        working-directory: frontend
        run: npx tsc -p tsconfig.json --noEmit

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npx vitest run

  quality-api:
    name: Quality · 后端
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 只装测试真正需要的轻量依赖。不装 requirements.txt：其中的 rapidocr /
      # onnxruntime / openvino / PyMuPDF / markitdown 体积大且平台相关，而被测模块
      # 在模块层只依赖下列轻量包，重型依赖都是函数内惰性导入。
      # 注意：测试集需要 fastapi（TestClient）、openpyxl（Excel 导出用例）、
      # python-multipart（表单端点）；缺任一项都会在 collection 阶段 ImportError。
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff pydantic httpx Pillow python-dotenv fastapi python-multipart openpyxl

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Unit tests (pytest)
        working-directory: backend
        # 失败时把详细 traceback 写进 run summary（Actions 页面匿名可见），便于诊断 runner 环境差异
        run: |
          python -c "import platform,sys; print('PY',sys.version,'PLATFORM',platform.platform())"
          python -m pytest -v --tb=short 2>&1 | tee pytest-output.txt | tail -60
          echo "### 后端 pytest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}

      - name: Upload pytest log (always, for diagnosis)
        if: always()
        working-directory: backend
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ github.run_id }}
          path: backend/pytest-output.txt
          retention-days: 7
          if-no-files-found: warn

  build-mac:
    name: macOS ${{ matrix.arch }}
    needs: [quality-web, quality-api]
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M 系列)
          - os: macos-14
            arch: arm64
          # Intel（macos-13 已于 2025-12-04 退役，任务会排队 24h 后被杀；
          # macos-15-intel 是官方免费替代标签，支持至 2027-08）
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    # 注意：原来的 continue-on-error 是加在整个 job 上的，会把编译/依赖错误一并吞掉。
    # 现已收窄到真正会偶发失败的 electron-builder 步骤上（见下方两步），
    # 这样 hdiutil detach "Resource busy" 不会标红，而其它真实失败仍会红灯。

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # DMG 构建后 hdiutil detach 被 Spotlight 索引占用 → Resource busy →
      # electron-builder "Cannot cleanup" 退出非零（macos-15-intel 必现），先关索引
      - name: Disable Spotlight indexing (fix hdiutil detach busy)
        run: |
          sudo mdutil -a -i off || true
          sudo pkill -f mds_stores || true

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build backend (PyInstaller)
        working-directory: backend
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller cinside-backend.spec --clean --noconfirm

      - name: Build Electron app and publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 只有这一步会因 hdiutil detach "Resource busy" 偶发非零退出（产物其实已生成）
        continue-on-error: true
        run: npx electron-builder --mac --${{ matrix.arch }} --publish always

      - name: Build Electron app (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        continue-on-error: true
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinside-macos-${{ matrix.arch }}
          path: |
            dist-electron/*.dmg
          if-no-files-found: warn

  # Windows x64：NSIS 安装包（主更新渠道：Setup + blockmap + latest.yml 驱动 electron-updater 自动更新）
  build-win:
    name: Windows x64
    needs: [quality-web, quality-api]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build

      - name: Build backend (PyInstaller)
        working-directory: backend
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller
          .\.venv\Scripts\pyinstaller.exe cinside-backend.spec --clean --noconfirm

      - name: Build Electron app and publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Build Electron app (manual run, no publish)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: frontend
        run: npx electron-builder --win --x64 --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cinside-windows-x64
          path: |
            dist-electron/*.exe
            dist-electron/latest.yml
            dist-electron/*.exe.blockmap
          if-no-files-found: warn
