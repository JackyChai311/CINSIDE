<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CINSIDE 数据源管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: #f0f2f5; color: #1f2937; }

    /* ===== 顶栏 ===== */
    .topbar { background: linear-gradient(135deg, #1e3a5f 0%, #2563eb 100%); color: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    .topbar .logo { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .topbar .logo .badge { background: rgba(255,255,255,.2); padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 400; }
    .topbar .nav { display: flex; gap: 4px; }
    .topbar .nav a { color: rgba(255,255,255,.8); text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; transition: .2s; }
    .topbar .nav a:hover, .topbar .nav a.active { background: rgba(255,255,255,.15); color: #fff; }
    .topbar .user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .topbar .user .avatar { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-weight: 600; }

    /* ===== 主体 ===== */
    .main { max-width: 1400px; margin: 0 auto; padding: 20px 24px; }

    /* 统计卡片 */
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; align-items: center; gap: 14px; }
    .stat-card .icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .stat-card .icon.blue { background: #dbeafe; color: #2563eb; }
    .stat-card .icon.green { background: #d1fae5; color: #059669; }
    .stat-card .icon.amber { background: #fef3c7; color: #d97706; }
    .stat-card .icon.purple { background: #ede9fe; color: #7c3aed; }
    .stat-card .val { font-size: 24px; font-weight: 700; line-height: 1.2; }
    .stat-card .lbl { font-size: 12px; color: #6b7280; }

    /* 搜索栏 */
    .toolbar { background: #fff; border-radius: 10px; padding: 14px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 240px; position: relative; }
    .search-box input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; transition: .2s; }
    .search-box input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.1); }
    .search-box .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 16px; }
    .filter-select { padding: 9px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: #fff; cursor: pointer; }
    .btn { padding: 9px 16px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; transition: .2s; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost { background: #f3f4f6; color: #374151; }
    .btn-ghost:hover { background: #e5e7eb; }

    /* 学生表格 */
    .table-wrap { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #f9fafb; }
    th { padding: 12px 16px; text-align: left; font-weight: 600; color: #6b7280; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; }
    td { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; white-space: nowrap; }
    tr:hover td { background: #f9fafb; }
    tr:last-child td { border-bottom: none; }
    .student-id { font-family: "SF Mono", "Fira Code", monospace; font-size: 12px; color: #2563eb; font-weight: 600; }
    .student-name { font-weight: 600; color: #1f2937; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .tag-biz { background: #dbeafe; color: #1e40af; }
    .tag-hum { background: #fef3c7; color: #92400e; }
    .tag-shanghai { background: #d1fae5; color: #065f46; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot-green { background: #10b981; }
    .dot-amber { background: #f59e0b; }
    .dot-gray { background: #9ca3af; }

    .pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; font-size: 13px; color: #6b7280; }
    .pagination .pages { display: flex; gap: 4px; }
    .pagination .pages button { width: 32px; height: 32px; border: 1px solid #e5e7eb; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .pagination .pages button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .pagination .pages button:hover:not(.active) { background: #f3f4f6; }
  </style>
</head>
<body>

  <!-- 搜索栏 -->

  </div>

  <!-- 学生表格 -->
  <div class="table-wrap">
    <table id="studentTable">
      <thead>
        <tr>

          <th>姓名</th>
          <th>邮箱</th>
          <th>家长邮箱</th>
          <th>学生电话</th>
          <th>家长电话</th>
          <th>Stream</th>
          <th>中心</th>
          <th>出生日期</th>

          <th>监护人</th>

      <tbody id="studentBody">

    </table>
    <div class="pagination">
      <span id="pageInfo">显示 1-15 / 共 15 条</span>
      <div class="pages">
        <button>‹</button>
        <button class="active">1</button>
        <button>2</button>
        <button>3</button>
        <button>›</button>
      </div>
    </div>
  </div>
</div>

function statusBadge(s) {
  if (s === "submitted") return '<span class="status-dot dot-green"></span>已提交';
  if (s === "pending") return '<span class="status-dot dot-amber"></span>待审核';
  return '<span class="status-dot dot-gray"></span>未提交';
}

function renderTable(list) {
  const tbody = document.getElementById("studentBody");
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;padding:40px;color:#9ca3af;">未找到匹配的学生记录</td></tr>';
  } else {
    tbody.innerHTML = list.map(s => `
      <tr>
        <td class="student-id">${s.id}</td>
        <td class="student-name">${s.name}</td>
        <td>${s.email}</td>
        <td>${s.guardianEmail}</td>
        <td>${s.phone}</td>
        <td>${s.guardianPhone}</td>
        <td><span class="tag ${s.stream === 'BIZ' ? 'tag-biz' : 'tag-hum'}">${s.stream}</span></td>
        <td><span class="tag tag-shanghai">${s.center}</span></td>
        <td>${s.dob}</td>
        <td>${s.age}</td>
        <td>${s.guardian}</td>
        <td>${statusBadge(s.status)}</td>
      </tr>
    `).join("");
  }
  document.getElementById("pageInfo").textContent = `显示 1-${list.length} / 共 ${list.length} 条`;
}

function filterTable() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const sf = document.getElementById("streamFilter").value;
  const cf = document.getElementById("centerFilter").value;
  const filtered = students.filter(s => {
    const matchQ = !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || s.email.toLowerCase().includes(q);
    const matchS = !sf || s.stream === sf;
    const matchC = !cf || s.center === cf;
    return matchQ && matchS && matchC;
  });
  renderTable(filtered);
}

function exportData() {
  alert("演示模式：数据已从 Excel 导入，无需再次导出");
}
