<svg xmlns="http://www.w3.org/2000/svg" viewBox="105 0 300 300" width="100%" height="100%">
  <g>
    <!-- 几何折线外框（原设计风格，容器缩小 + 圆角） -->
    <path d="M 150 40
             L 345 40
             Q 360 40 360 55
             L 360 170
             M 285 260
             L 150 260"
          fill="none"
          stroke="#000000"
          stroke-width="12"
          stroke-linecap="round"
          stroke-linejoin="round" />
    <!-- CINSIDE 文字 -->
    <text x="150" y="248"
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-size="28"
          font-weight="800"
          letter-spacing="0.5"
          fill="#000000">CINSIDE</text>
    <!-- 巨型字母 C -->
    <text x="265" y="265"
          font-family="Arial Black, Impact, sans-serif"
          font-size="135"
          font-weight="900"
          fill="#000000">C</text>
  </g>
</svg>
