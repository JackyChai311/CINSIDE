<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <text x="10" y="90"
        font-family="Arial Black, Impact, 'Segoe UI', sans-serif"
        font-size="80"
        font-weight="900"
        fill="#000000">CINSIDE</text>
  <!-- 紫色光标 -->
  <rect x="420" y="20" width="6" height="70" fill="#8a2be2" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
  <!-- 下划线光标 -->
  <rect x="435" y="80" width="30" height="6" fill="#8a2be2" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
