<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CINSIDE</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .container {
      text-align: center;
    }
    .logo {
      width: 420px;
      height: 100px;
      max-width: 90vw;
    }
    .hint {
      margin-top: 28px;
      color: #94a3b8;
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    .dots {
      display: inline-flex;
      gap: 6px;
      margin-left: 6px;
    }
    .dots span {
      width: 5px;
      height: 5px;
      background: #8a2be2;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <img class="logo" src="splash.svg" alt="CINSIDE" />
    <div class="hint">
      正在启动 CINSIDE
      <span class="dots">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </div>
  </div>
</body>
</html>
