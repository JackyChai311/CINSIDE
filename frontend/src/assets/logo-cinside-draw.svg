<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <style>
    .draw-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: draw 2.2s cubic-bezier(0.65, 0, 0.35, 1) forwards;
    }
    .draw-text {
      opacity: 0;
      animation: fadeIn 0.6s ease 1.8s forwards;
    }
    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    .loop .draw-path {
      animation: drawLoop 4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    .loop .draw-text {
      animation: fadeLoop 4s ease infinite;
    }
    @keyframes drawLoop {
      0%   { stroke-dashoffset: 1000; }
      45%  { stroke-dashoffset: 0; }
      85%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 1000; }
    }
    @keyframes fadeLoop {
      0%   { opacity: 0; }
      35%  { opacity: 0; }
      50%  { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; }
    }
  </style>
  <!-- 一笔连体动画：与静态版相同路径 -->
  <path
    class="draw-path"
    pathLength="1000"
    d="M52 36 H148 A16 16 0 0 1 164 52 V100 A18 22 0 0 1 164 144 V168 A16 16 0 0 1 148 184 H52 A16 16 0 0 1 36 168 V52 A16 16 0 0 1 52 36"
    stroke="#1a1a1a"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <text
    class="draw-text"
    x="100"
    y="220"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
    font-size="26"
    font-weight="700"
    letter-spacing="5"
    fill="#1a1a1a"
  >CINSIDE</text>
</svg>
