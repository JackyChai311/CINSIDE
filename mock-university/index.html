<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Demo University - Application Form</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fb; margin: 0; padding: 16px; color: #1f2937; }
    .container { width: 100%; max-width: none; margin: 0 auto; background: #fff; border-radius: 12px; padding: 32px 40px; box-shadow: 0 2px 12px rgba(0,0,0,.06); box-sizing: border-box; }
    h1 { margin: 0 0 4px; font-size: 24px; }
    .sub { color: #6b7280; margin-bottom: 28px; font-size: 14px; }
    h2 { font-size: 16px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-top: 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
    .field { display: flex; flex-direction: column; }
    label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    input, select { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; background: #f9fafb; }
    input:read-only { background: #f3f4f6; color: #374151; }
    .btn { background: #4f46e5; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 20px; }
    .btn:hover { background: #4338ca; }
    .note { color:#9ca3af; font-size:12px; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Demo University — Graduate Application</h1>
    <div class="sub">Application ID: DEMO-2025-0042 · Status: Submitted · 本页面用于核验演示</div>

    <h2>Personal Information</h2>
    <div class="row">
      <div class="field">
        <label>Full Name (as in passport)</label>
        <input id="name" value="ZHANG  SAN" readonly>
      </div>
      <div class="field">
        <label>Gender</label>
        <input id="gender" value="Male" readonly>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Date of Birth</label>
        <input id="birth_date" value="1995/03/15" readonly>
      </div>
      <div class="field">
        <label>Nationality</label>
        <input id="nationality" value="Chinese" readonly>
      </div>
    </div>

    <h2>Passport Details</h2>
    <div class="row">
      <div class="field">
        <label>Passport Number</label>
        <input id="passport_no" value="E12345678" readonly>
      </div>
      <div class="field">
        <label>Issue Date</label>
        <input id="passport_issue" value="2020-06-10" readonly>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>Expiry Date</label>
        <input id="passport_expiry" value="2030-06-09" readonly>
      </div>
    </div>

    <h2>Contact</h2>
    <div class="row">
      <div class="field">
        <label>Email</label>
        <input id="email" value="zhang.san@example.con" readonly>
        <div class="note">注意：这里故意写错了 .con，用于演示 mismatch</div>
      </div>
      <div class="field">
        <label>Phone</label>
        <input id="phone" value="+86 138 0000 0000" readonly>
      </div>
    </div>

    <button class="btn" onclick="alert('This is a demo form. No data submitted.')">Submit (Demo)</button>
  </div>
</body>
</html>
